version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cloudflare:
        patterns:
          - wrangler
          - "@cloudflare/*"
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
